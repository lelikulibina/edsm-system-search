[package]
name = "edsm-system-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "HTTP search service for Elite Dangerous bodies using the Spansh API"
license = "MIT"

[lib]
name = "edsm_system_search"
path = "src/lib.rs"

[[bin]]
name = "edsm-system-search"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
serde_urlencoded = "0.7"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
